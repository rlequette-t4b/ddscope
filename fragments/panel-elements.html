<!-- DIV 600 — Elements panel (left drawer, inside canvas wrap) + contextual remove button -->
<div class="dds-elements-panel" id="dds-elements-panel">
  <div class="dds-elements-panel-header">
    <span class="dds-elements-panel-title">Elements</span>
    <button class="dds-btn dds-btn-ghost dds-btn-sm" id="dds-elements-panel-close">&times;</button>
  </div>
  <div class="dds-elements-panel-body" id="dds-elements-panel-body">
    <!-- Rendered by JS -->
  </div>
</div>

<!-- Contextual remove button (canvas selection) -->
<div class="dds-ctx-remove" id="dds-ctx-remove">
  <button class="dds-btn dds-btn-danger dds-btn-sm" id="dds-ctx-remove-btn">Remove from map</button>
</div>
