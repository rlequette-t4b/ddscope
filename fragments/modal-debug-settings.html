<!-- DIV 110 — Settings Modal (developer toggles), opened from the header gear
     icon (#dds-header-settings-btn). Fully portable DDScope-owned modal
     chrome (.dds-overlay / .dds-modal, see styles/buttons-modal-forms.css) —
     no CommWise-specific classes, works unmodified in every framework.
     Controlled by SETTINGS (open/close) and DDS_SETTINGS (ISettingsService,
     get/set), both in core/DDS_SETTINGS.js — see docs/DDScope_Service_Settings.md.
     Not DDS_CONFIGURATION_UI (formerly DDS_SETTINGS_UI) — that module never
     touches this modal, see T-034. -->
<div id="dds-header-settings-overlay" class="dds-overlay">
    <div class="dds-modal" style="max-width:480px" role="dialog" aria-modal="true" aria-labelledby="dds-header-settings-title">
        <div class="dds-modal-header">
            <span class="dds-modal-title" id="dds-header-settings-title">⚙️ Settings</span>
            <button class="dds-btn dds-modal-close" aria-label="Close settings" onclick="SETTINGS.close()">&times;</button>
        </div>
        <div class="dds-modal-body">
            <div class="dds-settings-section">
                <h3 class="dds-settings-section-title">Developer</h3>
                <label class="dds-settings-row" for="dds-debug-toggle">
                    <span class="dds-settings-label">
                        <span class="dds-settings-label-text">Debug AI</span>
                        <span class="dds-settings-label-hint">Shows AI request/response details in the assistant panel</span>
                    </span>
                    <input type="checkbox" id="dds-debug-toggle" class="dds-settings-toggle"
                        onchange="DDS_SETTINGS.set('debug_ai', this.checked ? 'true' : 'false')">
                </label>
                <label class="dds-settings-row" for="dds-log-actions-toggle">
                    <span class="dds-settings-label">
                        <span class="dds-settings-label-text">Log actions</span>
                        <span class="dds-settings-label-hint">Shows a live panel of all DDS_ACTIONS.execute() calls</span>
                    </span>
                    <input type="checkbox" id="dds-log-actions-toggle" class="dds-settings-toggle"
                        onchange="DDS_SETTINGS.set('log_actions', this.checked ? 'true' : 'false').then(function() { if (window.DDS_ACTIONS_LOG) DDS_ACTIONS_LOG.applyVisibility(); })">
                </label>
                <label class="dds-settings-row" for="dds-show-bfs-ranks-toggle">
                    <span class="dds-settings-label">
                        <span class="dds-settings-label-text">Show BFS ranks</span>
                        <span class="dds-settings-label-hint">Displays min-max BFS rank badges on map nodes (requires running layout)</span>
                    </span>
                    <input type="checkbox" id="dds-show-bfs-ranks-toggle" class="dds-settings-toggle"
                        onchange="DDS_SETTINGS.set('show_bfs_ranks', this.checked ? 'true' : 'false').then(function() { if (window.DDS_MAP) { DDS_MAP.clearBfsRankBadges(); if (DDS_SETTINGS.isShowBfsRanks()) DDS_MAP.renderBfsRankBadges(DDS_MAP.state.currentMapId); } })">
                </label>
                <div class="dds-settings-row">
                    <span class="dds-settings-label">
                        <span class="dds-settings-label-text">Log level</span>
                        <span class="dds-settings-label-hint">Controls DDS_TOOLS.log verbosity (debug / info / warn / error / off)</span>
                    </span>
                    <select id="dds-log-level-select" class="dds-select" style="width:110px"
                        onchange="DDS_SETTINGS.set('log_level', this.value).then(function() { DDS_TOOLS.log.setLevel(document.getElementById('dds-log-level-select').value); })">
                        <option value="debug">debug</option>
                        <option value="info">info</option>
                        <option value="warn">warn</option>
                        <option value="error">error</option>
                        <option value="off">off</option>
                    </select>
                </div>
                <!-- Framework-agnostic (Both) — see docs/DDScope_Service_Settings.md §5,
                     docs/DDScope_AI_Assistant.md §6b. TODO T-039. -->
                <div class="dds-settings-row">
                    <span class="dds-settings-label">
                        <span class="dds-settings-label-text">AI model</span>
                        <span class="dds-settings-label-hint">Model used by the AI Assistant</span>
                    </span>
                    <select id="dds-ai-model-select" class="dds-select" style="width:220px"
                        onchange="DDS_SETTINGS.set('ai_model', this.value)">
                        <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
                        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
                    </select>
                </div>
            </div>
            <!-- Local framework only (window.DDS_FRAMEWORK === 'local') — shown/populated by
                 SETTINGS.init()/open() in core/DDS_SETTINGS.js. Never rendered under CommWise,
                 which never sets window.DDS_FRAMEWORK. See docs/DDScope_Service_Settings.md §5,
                 docs/DDScope_Service_AITransport.md §3 (ai-impl-2, TODO T-038). -->
            <div class="dds-settings-section dds-hidden" id="dds-settings-section-local">
                <h3 class="dds-settings-section-title">Local framework</h3>
                <label class="dds-settings-row" for="dds-anthropic-key-input">
                    <span class="dds-settings-label">
                        <span class="dds-settings-label-text">Anthropic API key</span>
                        <span class="dds-settings-label-hint">Used by the AI Assistant outside CommWise. Dev/demo only — stored in clear text in this browser's localStorage.</span>
                    </span>
                    <input type="password" id="dds-anthropic-key-input" class="dds-input" autocomplete="off"
                        onchange="DDS_SETTINGS.set('anthropic_api_key', this.value)">
                </label>
            </div>
        </div>
        <div class="dds-modal-footer">
            <button class="dds-btn dds-btn-secondary" onclick="SETTINGS.close()">Close</button>
        </div>
    </div>
</div>
