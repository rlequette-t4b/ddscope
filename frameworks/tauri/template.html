<!-- Platform stub: APP_CONTEXT, plus real injections reused from framework-2's
     baseline (settings-impl-2 LocalStorageSettings, ai-impl-2 DirectLLMTransport)
     — see docs/DDScope_Framework_Tauri.md §Status. -->
<script>
  // KNOWN SHORTCUT, not a permanent identity: set to 'local' (not 'tauri')
  // so that src/core/DDS_SETTINGS.js's `window.DDS_FRAMEWORK === 'local'`
  // check (gating the Anthropic/Gemini API key fields) also fires here.
  // That check is framework-2-specific by name, not by a broader "needs its
  // own API key" concept — reusing 'local' is the fastest path to the same
  // baseline behavior for the minimal shell, but conflates framework-2 and
  // framework-3 identity. Revisit once framework-3 has anything that needs
  // to tell the two apart (e.g. a Tauri-native IFileStorage/ISettingsService).
  // See docs/DDScope_Framework_Tauri.md §Content assembly.
  window.DDS_FRAMEWORK = 'local';

  window.APP_CONTEXT = {
    ready: function() {
      return Promise.resolve({ user: { email: 'desktop@ddscope.local' } });
    }
  };

  // ISettingsService backend (settings-impl-2 — LocalStorageSettings, reused
  // as-is from framework-2). Untested inside a Tauri webview as of this
  // phase — see docs/DDScope_Framework_Tauri.md §Explicitly out of scope.
  (function() {
    var PREFIX = 'ddscope.settings.';
    window.DDS_SETTINGS_BACKEND = {
      load: function() {
        var records = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) {
            records.push({ key: k.slice(PREFIX.length), value: localStorage.getItem(k) });
          }
        }
        return Promise.resolve(records);
      },
      upsert: function(key, value) {
        try { localStorage.setItem(PREFIX + key, value); }
        catch (e) { console.warn('[tauri shell] localStorage write failed', e); }
        return Promise.resolve();
      }
    };
  })();
</script>
