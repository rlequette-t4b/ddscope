      }
    </style>
  </defs>

  <!-- Outer ring (12 dots) -->
  <circle class="dot" cx="512" cy="180" r="24"/>
  <circle class="dot" cx="585" cy="207" r="24"/>
  <circle class="dot" cx="627" cy="273" r="24"/>
  <circle class="dot" cx="636" cy="360" r="24"/>
  <circle class="dot" cx="612" cy="447" r="24"/>
  <circle class="dot" cx="540" cy="510" r="24"/>
  <circle class="dot" cx="420" cy="522" r="24"/>
  <circle class="dot" cx="315" cy="465" r="24"/>
  <circle class="dot" cx="258" cy="375" r="24"/>
  <circle class="dot" cx="249" cy="270" r="24"/>
  <circle class="dot" cx="291" cy="195" r="24"/>
  <circle class="dot" cx="400" cy="150" r="24"/>

  <!-- Inner ring (8 dots) -->
  <circle class="dot" cx="512" cy="255" r="18"/>
  <circle class="dot" cx="585" cy="300" r="18"/>
  <circle class="dot" cx="615" cy="360" r="18"/>
  <circle class="dot" cx="562" cy="435" r="18"/>
  <circle class="dot" cx="457" cy="442" r="18"/>
  <circle class="dot" cx="345" cy="405" r="18"/>
