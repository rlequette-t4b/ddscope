<!-- Platform stub: APP_CONTEXT (not a real IService implementation, Step C — see
     docs/DDScope_Framework_Local.md §Stub status), plus two real, non-stub injections:
     window.DDS_SETTINGS_BACKEND (settings-impl-2, LocalStorageSettings) and
     window.DDS_FRAMEWORK / window.DDS_AI_TRANSPORT (ai-impl-2, DirectAnthropicTransport,
     src/ai/DDS_AI_TRANSPORT_LOCAL.js, wired below after the module script tags — TODO T-038). There is
     no commwiseConfigClient stub anymore: DDS_AI.js no longer calls it directly, it goes
     through window.DDS_AI_TRANSPORT (see docs/DDScope_Service_AITransport.md §1). -->
<script>
  // General-purpose signal, not settings- or AI-specific — lets any portable module
  // detect it is running under the local framework. CommWise never sets this.
  // See docs/DDScope_Service_Settings.md §5.
  window.DDS_FRAMEWORK = 'local';

  window.APP_CONTEXT = {
    ready: function() {
      return Promise.resolve({ user: { email: 'local-dev@ddscope.local' } });
    }
  };

  // ISettingsService backend (settings-impl-2 — LocalStorageSettings, see
  // docs/DDScope_Service_Settings.md). core/DDS_SETTINGS.js consumes
  // window.DDS_SETTINGS_BACKEND directly when present — real persistence,
  // not a stub: settings survive reloads via the browser's localStorage,
  // with zero CommWise-specific coupling (no DataStore shim needed here).
  (function() {
    var PREFIX = 'ddscope.settings.';
    window.DDS_SETTINGS_BACKEND = {
      load: function() {
        var records = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) {
            records.push({ key: k.slice(PREFIX.length), value: localStorage.getItem(k) });
          }
        }
        return Promise.resolve(records);
      },
      upsert: function(key, value) {
        try { localStorage.setItem(PREFIX + key, value); }
        catch (e) { console.warn('[local runner] localStorage write failed', e); }
        return Promise.resolve();
      }
    };
  })();
</script>
