<!-- Local framework — minimal header (DDScope brand + settings gear).
     Not mirrored from any CommWise block: CommWise's own DIV 100 (App
     Header) carries platform-specific info/nav-dropdown/logo chrome with no
     local equivalent (see frameworks/commwise/sync-tracker.md — DIV 100 /
     STYLE 100 skipped, "standard CommWise header, not customized"). This
     fixture is local-only, injected by frameworks/local/build.js at a
     hardcoded position — not tracked in sync-tracker.md (same pattern as the
     CDN loader fixtures).
     The settings button uses the same id (#dds-header-settings-btn) the
     portable SETTINGS controller (core/DDS_SETTINGS.js) binds to in every
     framework — see docs/DDScope_Service_Settings.md. -->

            title="Settings"
